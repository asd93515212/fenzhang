<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>分帳本</title>
<style>
:root{--bg:#e9eeee;--sf:#fff;--tx:#173a36;--mu:#5d7773;--ln:#d3dddc;--ac:#0f6b62;--ac2:#fff;--bad:#b3261e;
 --c1:#0f6b62;--c2:#d9941a;--c3:#3b6fb6;--c4:#9a5ab5;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1b1a;--sf:#17282680;--tx:#e3f0ee;--mu:#8fb0ab;--ln:#2a403d;--ac:#4fc4b6;--ac2:#06231f;--bad:#ff8a80;--c1:#4fc4b6;--c2:#f0b84a;--c3:#7da8e8;--c4:#c796dd;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1b1a;--sf:#172826;--tx:#e3f0ee;--mu:#8fb0ab;--ln:#2a403d;--ac:#4fc4b6;--ac2:#06231f;--bad:#ff8a80;--c1:#4fc4b6;--c2:#f0b84a;--c3:#7da8e8;--c4:#c796dd;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sf:#172826}}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif;font-variant-numeric:tabular-nums}
main{max-width:480px;margin:0 auto;padding:16px 16px 40px}
.tabs{display:flex;gap:6px;background:var(--ln);padding:4px;border-radius:12px}
.tabs button{flex:1;border:0;background:none;color:var(--mu);font:inherit;font-weight:600;padding:10px;border-radius:9px}
.tabs button[aria-selected=true]{background:var(--sf);color:var(--tx)}
.total{margin:22px 4px 10px}
.total small{color:var(--mu)}
.total b{display:block;font-size:40px;line-height:1.15;letter-spacing:-.5px}
.bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--ln);margin:0 4px 16px}
.bar i{display:block;min-width:0;transition:width .35s}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.w{background:var(--sf);border-radius:14px;padding:12px 14px;border-left:6px solid var(--k)}
.w small{color:var(--mu);display:block}
.w b{font-size:21px}
.acts{display:flex;gap:10px;margin:18px 0}
.btn{flex:1;border:0;border-radius:12px;padding:14px;font:inherit;font-weight:700;background:var(--ac);color:var(--ac2)}
.btn.o{background:var(--sf);color:var(--tx);border:1px solid var(--ln)}
h2{font-size:15px;margin:24px 4px 8px;color:var(--mu);font-weight:600}
.log{background:var(--sf);border-radius:14px;overflow:hidden}
.log div{padding:10px 14px;border-bottom:1px solid var(--ln);display:flex;justify-content:space-between;gap:10px}
.log div:last-child{border:0}
.log small{color:var(--mu);display:block}
.pos{color:var(--ac)}.neg{color:var(--bad)}
.rec{background:var(--sf);border-radius:14px;padding:12px 14px}
.rec input{width:100%}
dialog{border:0;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));background:var(--sf);color:var(--tx);width:100%;max-width:480px;margin:auto auto 0;font:inherit}
dialog::backdrop{background:#0008}
label{display:block;font-size:14px;color:var(--mu);margin:12px 0 4px}
input,select{width:100%;font:inherit;font-size:18px;padding:11px 12px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);color:var(--tx)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chips button{border:1px solid var(--ln);background:var(--bg);color:var(--tx);font:inherit;padding:8px 14px;border-radius:20px}
.chips button[aria-pressed=true]{background:var(--ac);color:var(--ac2);border-color:var(--ac)}
.pv{background:var(--bg);border-radius:12px;padding:10px 12px;margin-top:14px}
.pv div{display:flex;justify-content:space-between;padding:2px 0}
.pv .sum{border-top:1px solid var(--ln);margin-top:4px;padding-top:6px;color:var(--mu)}
.row{display:flex;gap:10px;margin-top:16px}
</style>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="分帳本"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="theme-color" content="#0f6b62">
</head>
<body>
<main>
<div class="tabs" role="tablist"><button role="tab" id="t-twd" aria-selected="true">台幣帳戶</button><button role="tab" id="t-rmb" aria-selected="false">人民幣帳戶</button></div>
<div class="chips" id="fl" style="margin-top:14px"></div><div class="total"><small id="tl">台幣總額</small><b id="tv"></b></div>
<div class="bar" id="bar"></div>
<div class="grid" id="grid"></div>
<div class="acts"><button class="btn" id="bin">入帳</button><button class="btn o" id="bout">支出</button><button class="btn o" id="badj">調整</button></div>
<h2>對帳</h2>
<div class="rec"><label for="real" id="rl" style="margin-top:0">帳戶實際餘額</label><input id="real" type="number" inputmode="decimal" placeholder="輸入銀行 App 上的金額"><div id="diff" style="margin-top:8px;color:var(--mu)"></div></div>
<h2>最近紀錄</h2>
<div class="log" id="log"></div>
<h2>備份</h2>
<div class="acts" style="margin-top:0"><button class="btn o" id="bk">複製備份</button><button class="btn o" id="rs">還原備份</button></div>
</main>
<dialog id="dlg"><div id="dbody"></div></dialog>
<script>
var N={twd:[['buy','代購','--c1'],['self','自用','--c2'],['card','繳信用卡','--c3']],
 rmb:[['keep','留存','--c2'],['reserve','儲備池','--c4'],['live','活存','--c1'],['stock','囤貨','--c3']]};
var CH={twd:[['mb','賣貨便'],['sp','蝦皮']],rmb:[['wx','微信'],['ali','支付寶']]},F={twd:'all',rmb:'all'};
function mk(a){var o={};CH[a].forEach(function(c){o[c[0]]={};N[a].forEach(function(w){o[c[0]][w[0]]=0})});return o}
var S={bal:{twd:mk('twd'),rmb:mk('rmb')},log:[],pref:{rate:1,live:40}};
try{var s=localStorage.getItem('splitledger');if(s){S=JSON.parse(s)}}catch(e){}
['twd','rmb'].forEach(function(a){var b=S.bal[a];if(typeof b[N[a][0][0]]=='number'){var z=mk(a);z[CH[a][0][0]]=b;S.bal[a]=z}});
function save(){try{localStorage.setItem('splitledger',JSON.stringify(S))}catch(e){}}
var A='twd',mode='in',rate=S.pref.rate,lv=S.pref.live;
function $(i){return document.getElementById(i)}
function r2(x){return Math.round(x*100)/100}
function fmt(x){return (A=='twd'?'NT$ ':'¥ ')+x.toLocaleString('zh-TW',{minimumFractionDigits:A=='twd'?0:2,maximumFractionDigits:2})}
function f2(a,x){return (a=='twd'?'NT$ ':'¥ ')+x.toLocaleString('zh-TW',{minimumFractionDigits:a=='twd'?0:2,maximumFractionDigits:2})}
function vals(a){var o={};N[a].forEach(function(w){o[w[0]]=0});CH[a].forEach(function(c){if(F[a]=='all'||F[a]==c[0])N[a].forEach(function(w){o[w[0]]=r2(o[w[0]]+S.bal[a][c[0]][w[0]])})});return o}
function total(a){var v=vals(a),t=0;for(var k in v)t+=v[k];return r2(t)}
function cn(a,c){var r=CH[a].filter(function(x){return x[0]==c})[0];return r?r[1]:''}
function chSel(){var d=F[A]!='all'?F[A]:((S.pref.ch||{})[A]||CH[A][0][0]);return '<label for="chs">'+(mode=='in'?(A=='twd'?'入款來源':'收款方式'):mode=='adj'?'調整哪個帳戶':'從哪個帳戶扣')+'</label><select id="chs">'+CH[A].map(function(c){return '<option value="'+c[0]+'"'+(c[0]==d?' selected':'')+'>'+c[1]+'</option>'}).join('')+'</select>'}
function split(a,amt){var o={};
 if(a=='twd'){o.buy=Math.round(amt*.4);o.self=Math.round(amt*.3);o.card=amt-o.buy-o.self}
 else{o.keep=r2(amt*rate/100);var rest=amt-o.keep;o.reserve=r2(rest*.05);var rem=r2(rest-o.reserve);o.live=r2(rem*lv/100);o.stock=r2(rem-o.live)}
 return o}
function render(){
 $('t-twd').setAttribute('aria-selected',A=='twd');$('t-rmb').setAttribute('aria-selected',A=='rmb');
 var fl='<button data-c="all" aria-pressed="'+(F[A]=='all')+'">全部</button>';CH[A].forEach(function(c){fl+='<button data-c="'+c[0]+'" aria-pressed="'+(F[A]==c[0])+'">'+c[1]+'</button>'});$('fl').innerHTML=fl;$('rl').textContent=F[A]=='all'?'全部合計的實際餘額':cn(A,F[A])+'帳戶的實際餘額';$('tl').textContent=(A=='twd'?'台幣':'人民幣')+(F[A]=='all'?'總額':'・'+cn(A,F[A]));$('tv').textContent=fmt(total(A));
 var t=total(A),V=vals(A),bar='',g='';
 N[A].forEach(function(w){var v=V[w[0]];bar+='<i style="width:'+(t>0?Math.max(0,v/t*100):0)+'%;background:var('+w[2]+')"></i>';
  g+='<div class="w" style="--k:var('+w[2]+')"><small>'+w[1]+'</small><b>'+fmt(v)+'</b></div>'});
 $('bar').innerHTML=bar;$('grid').innerHTML=g;
 var L=S.log.filter(function(x){return x.a==A&&(F[A]=='all'||x.c==F[A])}).slice(0,8),h='';
 L.forEach(function(x){h+='<div><span>'+x.t+'<small>'+x.d+'</small></span><b class="'+(x.v>=0?'pos':'neg')+'">'+(x.v>=0?'+':'−')+f2(A,Math.abs(x.v)).replace(/^(\S+ )/,'$1')+'</b></div>'});
 $('log').innerHTML=h||'<div><span>還沒有紀錄。按「入帳」開始。</span></div>';
 upDiff()}
function upDiff(){var v=parseFloat($('real').value),e=$('diff');
 if(isNaN(v)){e.textContent='填入實際餘額，會顯示和 App 差多少。';return}
 var d=r2(v-total(A));e.innerHTML=d==0?'<b class="pos">帳目吻合</b>':'差額 <b class="neg">'+(d>0?'+':'−')+f2(A,Math.abs(d))+'</b>（實際比 App '+(d>0?'多':'少')+'，可能漏記）'}
var dir=1;function open(m){mode=m;var h='';
 h+='<b style="font-size:18px">'+(m=='in'?'新增入帳':m=='adj'?'手動加減':'記一筆支出')+'・'+(A=='twd'?'台幣':'人民幣')+'</b>';
 h+=chSel();if(m!='in'){h+='<label for="wl">'+(m=='adj'?'調整哪個錢包':'從哪個錢包扣')+'</label><select id="wl">'+N[A].map(function(w){return '<option value="'+w[0]+'">'+w[1]+'</option>'}).join('')+'</select>'}
 if(m=='adj')h+='<label>方向</label><div class="chips" id="dr"><button data-v="1">＋ 加</button><button data-v="-1">－ 減</button></div>';h+='<label for="amt">金額</label><input id="amt" type="number" inputmode="decimal" placeholder="0">';if(m=='adj')h+='<label for="nt">備註（選填）</label><input id="nt" type="text" placeholder="例如：補記漏掉的款項" style="font-size:16px">';
 if(m=='in'&&A=='rmb'){
  h+='<label>商品留存比率</label><div class="chips" id="cr"><button data-v="1">1% 商品</button><button data-v="3">3% 商品</button></div>';
  h+='<label>活存／囤貨比率（活存 %）</label><div class="chips" id="cl"><button data-v="30">30/70</button><button data-v="40">40/60</button><button data-v="custom">自訂</button></div><input id="cv" type="number" inputmode="decimal" style="margin-top:8px;display:none" placeholder="活存 %">'}
 if(m=='in')h+='<div class="pv" id="pv"></div>';
 h+='<div class="row"><button class="btn o" id="cx">取消</button><button class="btn" id="ok">'+(m=='in'?'確認入帳':m=='adj'?'確認調整':'確認支出')+'</button></div>';
 $('dbody').innerHTML=h;$('dlg').showModal();
 $('amt').oninput=pv;$('cx').onclick=function(){$('dlg').close()};$('ok').onclick=commit;
 if($('cr')){chips('cr',rate,function(v){rate=+v});chips('cl',[30,40].indexOf(lv)>=0?lv:'custom',function(v){if(v=='custom'){$('cv').style.display='block';$('cv').value=lv;$('cv').oninput=function(){lv=Math.min(100,Math.max(0,+this.value||0));pv()}}else{$('cv').style.display='none';lv=+v}})}
 if($('dr')){dir=1;chips('dr','1',function(v){dir=+v})}pv();setTimeout(function(){$('amt').focus()},50)}
function chips(id,cur,cb){var c=$(id);function mark(){[].forEach.call(c.children,function(b){b.setAttribute('aria-pressed',b.dataset.v==cur)})}
 mark();c.onclick=function(e){var b=e.target.closest('button');if(!b)return;cur=b.dataset.v;mark();cb(cur);pv()};cb(cur)}
function pv(){if(mode!='in')return;var a=parseFloat($('amt').value)||0,o=split(A,a),h='';
 N[A].forEach(function(w){h+='<div><span>'+w[1]+'</span><b>'+f2(A,o[w[0]])+'</b></div>'});
 h+='<div class="sum"><span>合計</span><span>'+f2(A,a)+'</span></div>';$('pv').innerHTML=h}
function commit(){var a=parseFloat($('amt').value);if(!(a>0)){$('amt').focus();return}
 var c=$('chs').value,d=new Date(),ds=(d.getMonth()+1)+'/'+d.getDate()+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);
 if(mode=='in'){var o=split(A,a);for(var k in o)S.bal[A][c][k]=r2(S.bal[A][c][k]+o[k]);
  S.log.unshift({a:A,c:c,t:'入帳・'+cn(A,c),v:a,d:ds+(A=='rmb'?'・留存 '+rate+'%・活存 '+lv+'%':'・40/30/30')});S.pref.rate=rate;S.pref.live=lv;(S.pref.ch=S.pref.ch||{})[A]=c}
 else{var w=$('wl').value,sg=mode=='adj'?dir:-1;S.bal[A][c][w]=r2(S.bal[A][c][w]+sg*a);var nm=N[A].filter(function(x){return x[0]==w})[0][1];S.log.unshift({a:A,c:c,t:(mode=='adj'?'調整・':'支出・')+nm,v:sg*a,d:ds+'・'+cn(A,c)+(mode=='adj'&&$('nt').value?'・'+$('nt').value.replace(/[<>&]/g,''):'')})}
 save();$('dlg').close();render()}
$('t-twd').onclick=function(){A='twd';render()};$('t-rmb').onclick=function(){A='rmb';render()};
$('bin').onclick=function(){open('in')};$('bout').onclick=function(){open('out')};$('badj').onclick=function(){open('adj')};$('real').oninput=upDiff;$('fl').onclick=function(e){var b=e.target.closest('button');if(b){F[A]=b.dataset.c;render()}};
$('bk').onclick=function(){var t=JSON.stringify(S);(navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){alert('已複製備份。請貼到備忘錄保存。')},function(){prompt('請全選並複製：',t)})};
$('rs').onclick=function(){var t=prompt('貼上備份內容');if(!t)return;try{var o=JSON.parse(t);if(!o.bal)throw 0;S=o;save();location.reload()}catch(e){alert('備份內容無法讀取')}};
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(function(){});
render();
</script>
</body>
</html>
